# pwrmon.conf - power / UPS monitor (Linux port scaffold).
#
# The Linux integration point is NUT (Network UPS Tools). Point upsmon's
# NOTIFYCMD / a NOTIFYFLAG ONBATT handler at:  pwrmon --power-fail
# On power loss pwrmon issues the graceful controller shutdown (ShutdownHBA,
# CALIBRATE - i2 opcode not yet recovered).
ups              = vess@localhost      # NUT UPS to watch
shutdownDelaySec = 60                  # grace period before ShutdownHBA
logfile          = /var/log/pwrmon.log # RECOVERED name: pwrmon.log
