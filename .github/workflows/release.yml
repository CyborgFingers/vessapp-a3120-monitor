name: release

# On a version tag (v1.2.3), build the container image and publish it to the
# GitHub Container Registry as ghcr.io/<owner>/vessapp-a3120-monitor:<version>
# and :latest. TrueNAS then installs it with no build step (Apps -> Discover ->
# Install via YAML), and the in-app updater pulls new tags from here.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the name, so a mixed-case org still yields
          # a valid GHCR reference.
          images: ghcr.io/${{ github.repository_owner }}/vessapp-a3120-monitor
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: port/packaging/container/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
