# php-fpm drop-in: pass the Promise knob file (I2BDG_SG_DEV) to the FPM master,
# whose MINIT decides fixture (mock substrate) vs device (/dev/sg*) mode for the
# php_i2 extension. The webpam pool sets clear_env=no so workers inherit it too.
#
# install.sh copies this to /etc/systemd/system/php<X.Y>-fpm.service.d/promise.conf
[Service]
EnvironmentFile=-/etc/promise/promise.env
