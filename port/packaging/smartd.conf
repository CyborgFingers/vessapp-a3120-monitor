# smartd.conf - VessApp Linux port drive-health monitoring.
# Monitor every ATA/SCSI disk smartd can scan and run promise-smartd-notify on a
# fault, routing it into the Promise event/alert pipeline (event log + email +
# SNMP trap + buzzer). Installed by install.sh in device mode; smartd is enabled
# alongside promise-mdmonitor. Directives:
#   -H            overall SMART health self-assessment
#   -f            failure of any 'pre-fail' (usage) Attribute
#   -l error      ATA error-log entry count increases
#   -l selftest   self-test log records a new failure
#   -C 197        a new Current_Pending_Sector appears
#   -U 198        a new Offline_Uncorrectable sector appears
#   -m root -M exec <notifier>   run the notifier instead of the built-in mailer
#                                (promise-smartd-notify owns all delivery)
DEVICESCAN -H -f -l error -l selftest -C 197 -U 198 -m root -M exec /opt/promise/bin/promise-smartd-notify
