v.admintools.toollist = Liste des outils
v.admintools.usermanagement = Gestion des utilisateurs
v.admintools.usermgmtdesc = Permet de créer et supprimer des comptes utilisateur, de définir une adresse e-mail, un abonnement à un événement, un mot de passe et des privilèges d'accès.
v.admintools.networkmanagement = Gestion du réseau
v.admintools.networkmgmtdesc = Permet de définir les paramètres du port de gestion du contrôleur, notamment l'adresse IP, le masque de sous-réseau et la prise en charge du protocole DHCP.
v.admintools.iscsimanagement = Gestion iSCSI
v.admintools.iscsimgmtdesc = Permet de définir des paramètres pour le nÿud iSCSI, les ports, iSNS, SLP et CHAP. Affiche les statistiques du nÿud iSCSI, des ports et des sessions. Vous permet de pinger d'autres ports iSCSI.
v.admintools.fibrechannelmanagement = Gestion Fibre Channel
v.admintools.fibrechannelmgmtdesc = Permet de définir des paramètres pour les ports Fibre Channel. Affiche l'état du nÿud, des ports et des SFP. Affiche des listes d'initiateurs et de périphériques connectés. Affiche des statistiques sur les ports.
v.admintools.sasmanagement = Gestion SAS
v.admintools.sasmgmtdesc = Permet de définir les paramètres des ports hôtes SAS. Affiche l'état des ports. Affiche des statistiques sur les ports.
v.admintools.scsimanagement = Gestion SCSI
v.admintools.scsimgmtdesc = Permet d'activer des cibles, de définir des paramètres de terminaison et de regrouper les statistiques des ports SCSI dans un rapport.
v.admintools.servicemanagement = Gestion des services
v.admintools.servicemgmtdesc = Permet d'afficher la liste des services, leur état et leur type de démarrage. Permet également d'accéder aux fonctions de mise à jour du logiciel/micrologiciel et d'exportation/importation de la base de données utilisateur.
v.admintools.snmpmanagement = Gestion SNMP
v.admintools.snmpmgmtdesc = Permet d'afficher les paramètres, le type de démarrage et le démarrage/arrêt du service SNMP ; permet également d'afficher les paramètres du récepteur d'interruptions.
v.admintools.netsendmanagement = Gestion de Netsend
v.admintools.netsendmgmtdesc = Permet d'afficher les paramètres, le type de démarrage et le démarrage/arrêt du service Netsend ; permet également d'afficher les paramètres des destinataires.
v.admintools.webserversetting = Paramétrage du serveur Web
v.admintools.webserversettingdesc = Permet d'afficher les paramètres, le type de démarrage et le démarrage/arrêt du serveur Web ; permet également d'afficher les paramètres SSL.
v.admintools.tomcatwebserversettingdesc = Permet de définir les paramètres relatifs aux ports, à l'expiration de la session et à SSL
v.admintools.emailsetting = Paramétrage de l'e-mail
v.admintools.emailsettingdesc = Permet d'afficher les paramètres, le type de démarrage et le démarrage/arrêt du service de messagerie électronique ; permet également d'afficher les paramètres SMTP et la fonction de message d'essai.
v.admintools.proemailsettingdesc = Permet d'identifier un message électronique de notification d'événement, de spécifier un serveur de messagerie électronique et d'utiliser la fonction ESMTP
v.admintools.telnetsetting = Paramétrage de Telnet
