v.admintools.confirm.restartsubsystem = Während des Neustarts des Subsystems ist kein Zugriff auf eines der logischen Laufwerke möglich. Dies kann zu Betriebsunterbrechungen und Datenverlusten führen.\\nGeben Sie CONFIRM ein und drücken Sie OK, um das Subsystem neu zu starten; klicken Sie andernfalls auf Abbrechen.
v.admintools.confirm.shutdownsubsystem = Während des Herunterfahrens des Subsystems ist kein Zugriff auf eines der logischen Laufwerke möglich. Dies kann zu Betriebsunterbrechungen und Datenverlustenführen.\\nGeben Sie CONFIRM ein und drücken Sie OK, um das Subsystem herunterzufahren; klicken Sie andernfalls auf Abbrechen.
v.admintools.confirm.poweroffsubsystem=Während der Ausschaltung des Subsystems werden alle logischen Laufwerke unzugänglich.\\nGeben Sie zum Ausschalten des Subsystems CONFIRM (Bestätigen) ein und klicken Sie auf OK; klicken Sie andernfalls auf Cancel (Abbrechen).
v.admintools.confirm.restartcontroller = Während des Neustarts des Controllers ist kein Zugriff auf eines der logischen Laufwerke möglich. Dies kann zu Betriebsunterbrechungen und Datenverlustenführen.\\nGeben Sie CONFIRM ein und drücken Sie OK, um den Controller neu zu starten; klicken Sie andernfalls auf Abbrechen.
v.admintools.confirm.shutdowncontroller = Während des Herunterfahrens des Controllers ist kein Zugriff auf eines der logischen Laufwerke möglich. Dies kann zu Betriebsunterbrechungen und Datenverlusten führen.\\nGeben Sie CONFIRM ein und drücken Sie OK, um den Controller herunterzufahren; klicken Sie andernfalls auf Abbrechen.
v.admintools.confirm.restorefactorynetmgmtsetting = Geben Sie CONFIRM (Bestätigen) ein, um zu bestätigen, dass Sie die Werkseinstellungen wiederherstellen möchten.\\nVorsicht: Sie haben die Option zum Wiederherstellen der Standardeinstellungen für die Netzwerkverwaltung gewählt.\\nÄndern dieser Einstellungen stellt alle netzwerkbezogenen Funktionen offline.\\nSie werden den gesamten Verwaltungszugriff auf das Subsystem verlieren.\\nSie müssen zur Wiedererlangung des Zugriffs eine Verbindung mit dem Subsystem über serielle Schnittstelle herstellen und Ihre Netzwerkverbindung rekonfigurieren.\\nKlicken Sie nur auf OK, sofern Sie wirklich fortfahren möchten. 
