# Runtime dir for the php_i2 extension's opas dc-challenge / login-session table
# (MAP_SHARED file /run/promise/opas-sessions.dat, override via VESSAPP_SESSION_FILE).
# php-fpm's webpam pool runs as www-data and must own this dir: /run is tmpfs, so
# after a reboot the dir would otherwise return as root:root, open() would fail for
# the www-data workers, and each worker would silently fall back to a PRIVATE,
# unshared session table -> a login challenge issued on one fpm worker never
# validates on the next -> cross-worker login fails. Keep the path/owner in sync
# with opas_session_create() and install-webpam.sh.
d /run/promise 0755 www-data www-data -
