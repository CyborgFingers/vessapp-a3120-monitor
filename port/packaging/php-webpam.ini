; php-webpam.ini - PHP config for the packaged WebPAM tier (Phase 6).
;
; Same posture as port/web/php-fixture.ini (the shipped appliance bundled PHP
; 7.3; the htdocs use PHP4-style constructors, so the tier runs on PHP 7.x):
; notices/deprecations silenced, warnings/fatals visible so the smoke can
; assert their absence. File sessions are the cross-FPM-worker $_SESSION store.
;
; Installed to the FPM conf.d (container: /usr/local/etc/php/conf.d/;
; device: /etc/php/7.4/fpm/conf.d/90-promise-webpam.ini).
; The htdocs use <? short tags throughout (index.php, front.php, ...). The
; official php-fpm containers ship NO php.ini, so the compiled-in default
; (short_open_tag=On) applied silently in Phases 4/6; Debian's packaged
; php.ini-production sets it Off, which would render <? blocks as literal HTML.
short_open_tag = On
; PHP 8 reclassified undefined index/variable from E_NOTICE to E_WARNING; the
; appliance posture silenced them as notices on PHP 7, so silence E_WARNING on
; PHP 8 to keep the same signal: fatals/parse errors still render (and the
; smokes assert their absence). E_STRICT is gone (deprecated constant in 8.4).
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_WARNING
; Shipped php.ini has display_errors = Off; On here so the smoke can assert no
; errors render. Flip to Off for a hardened production box.
display_errors = On
log_errors = Off

; ---- mirrored verbatim from the shipped WebServer/php/php.ini ---------------
; output_buffering is LOAD-BEARING: event.php sets cookies after event0.php has
; already emitted output - only legal because the appliance buffered output.
output_buffering = On
max_execution_time = 120
memory_limit = 512M
post_max_size = 40M
upload_max_filesize = 40M

; File sessions = the cross-FPM-worker $_SESSION store (shipped: files too).
; Shipped session.cookie_secure = 1 assumed the HTTPS stunnel; leave default 0
; for plain-HTTP off-device use, set 1 when the TLS server block is enabled.
session.save_path = "/tmp"

extension = /opt/promise/lib/php/i2.so
auto_prepend_file = /opt/promise/webpam/compat-prepend.php
