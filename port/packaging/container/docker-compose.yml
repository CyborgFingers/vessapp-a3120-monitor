# webpam-monitor - TrueNAS SCALE Custom App (Apps -> Discover -> Custom App ->
# "Install via YAML"), or `docker compose up -d` on any Docker host.
#
# privileged + pid:host are REQUIRED: the container reads the HOST's zpool and
# smartctl by nsenter-ing into PID 1, so the tool versions always match the host
# and no ZFS userland is shipped in the image. The monitor only ever READS - it
# has no drive-management code path at all.
services:
  webpam-monitor:
    image: webpam-monitor:local        # build first: see README.md (docker build ...)
    pull_policy: never                 # use the locally-built image, never try a registry
    container_name: webpam-monitor
    restart: unless-stopped
    privileged: true                   # required for nsenter into the host
    pid: host                          # required: share the host PID namespace (nsenter -t 1)
    ports:
      - "8443:8443"                    # HTTPS UI
      - "8088:8088"                    # HTTP -> redirects to 8443
    environment:
      # First-run login password (or omit and set it with:
      #   docker exec webpam-monitor /opt/promise/bin/promise-webpam-passwd <pw>)
      WEBPAM_PASSWORD: "change-me-please"
      HEALTH_REFRESH: "60"             # seconds between host health snapshots
    volumes:
      - webpam_monitor_cfg:/etc/promise # persist the TLS cert + login password
volumes:
  webpam_monitor_cfg:
