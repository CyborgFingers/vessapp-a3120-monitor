; fpm-webpam.conf - PHP-FPM pool for the WebPAM web tier (Phase 6).
;
; A small static pool: the A3120 is a single-admin appliance, and 4 workers
; comfortably cover the frameset's parallel frame requests. The php_i2
; extension's dc/session store is fork-shared (opas_session.c: MAP_SHARED mmap
; created at MINIT in the FPM master), so any worker can validate a challenge
; or session issued by any other; PHP's own $_SESSION uses file sessions
; (session.save_path, php-webpam.ini) which are cross-worker by nature.
;
; Used verbatim by the container check (_fpm-inner.sh) and on-device
; (install.sh -> /etc/php/7.4/fpm/pool.d/webpam.conf).

[webpam]
user  = www-data
group = www-data

listen       = /run/php-webpam.sock
listen.owner = www-data
listen.group = www-data

pm              = static
pm.max_children = 4
pm.status_path  = /fpm-status

; Pass the service environment (I2BDG_SG_DEV from /etc/promise/promise.env via
; the php-fpm unit drop-in) through to the extension.
clear_env = no

; Surface PHP worker stderr in the FPM/journal log.
catch_workers_output = yes
