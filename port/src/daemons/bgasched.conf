# bgasched.conf - background-activity schedule (Linux port scaffold).
#
# On-device, bgasched.exe reads these from the engine (_getBGASchedules) and
# arms them by power-on count / calendar window. Here the daemon loads this file
# and logs the activities it would schedule (the engine apply is CALIBRATE).
# One activity per line: <activity> <cadence>.
media-patrol       weekly-sun-03:00
redundancy-check   monthly-01-04:00
spare-check        daily-02:00
