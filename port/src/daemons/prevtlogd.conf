# prevtlogd.conf - engine event-log daemon (Linux port scaffold).
#
# prevtlogd polls the engine event log and writes each event to syslog (the
# Linux stand-in for the Windows Application EventLog). The last-processed
# sequence is persisted so events are not re-logged across restarts.
seqFile  = /tmp/prevtlogseq   # RECOVERED name: prevtlogseq (last event seq)
facility = daemon             # syslog facility
pollSec  = 5                  # engine event-log poll interval (CALIBRATE)
