# nginx-webpam.conf - WebPAM PROe server block (Phase 6).
#
# Replaces the shipped XAMPP Apache + stunnel front end. nginx + PHP-FPM give
# the web tier real concurrency: the post-login frameset (screen.php -> header/
# tree/home/event/daemon frames) issues parallel requests that a single-threaded
# `php -S` cannot serve; FPM's worker pool can.
#
# Used verbatim in two places (same /opt/promise layout):
#   - container check:  packaging/_fpm-inner.sh drops it in /etc/nginx/conf.d/
#   - on-device:        install.sh -> /etc/nginx/sites-available/promise-webpam
#
# ALL-TLS posture: :8088 (HTTP) 301-redirects to :8443 (HTTPS), so passwords, the
# session token, and all data are encrypted end-to-end - matching the appliance's
# self-signed stunnel front end. install-webpam.sh auto-generates the self-signed
# cert (/etc/promise/webpam.crt|.key) on first install. Linux (PAM) login is only
# offered over HTTPS (fastcgi_param HTTPS on -> $_SERVER['HTTPS']).

# HTTP :8088 -> force HTTPS. Keep the listener only to bounce browsers to TLS.
server {
    listen 8088;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate     /etc/promise/webpam.crt;
    ssl_certificate_key /etc/promise/webpam.key;

    root  /opt/promise/webpam/htdocs;
    index index.php;

    # WebPAM is ~130 top-level .php pages + static assets (images/, js/, css/).
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass  unix:/run/php-webpam.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # defense.php compares the Referer host against SERVER_NAME on every
        # non-login POST and die()s empty on mismatch; hand PHP the request Host.
        fastcgi_param SERVER_NAME $host;
        # WebPAM builds its login-form action + post-login redirects from
        # HTTP_HOST, so restore the authoritative listen port (:8443 here) that
        # Debian's fastcgi_params drops. defense.php strips the port before the
        # CSRF compare, so this is safe.
        fastcgi_param HTTP_HOST $host:$server_port;
        # tell PHP the request arrived over TLS ($_SERVER['HTTPS']); the PAM login
        # path requires this so a Linux password is never accepted over plain HTTP.
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 300;
    }

    # FPM pool health (ops only; also asserted by packaging/fpm-smoke.sh).
    location = /fpm-status {
        allow 127.0.0.1;
        deny  all;
        include fastcgi_params;
        fastcgi_pass  unix:/run/php-webpam.sock;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
    }
}
