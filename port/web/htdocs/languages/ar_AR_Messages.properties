v.admintools.confirm.shutdowncontroller = يتعذر الوصول لكافة محركات الأقراص المنطقية أثناء إيقاف تشغيل وحدة التحكم. قد يتسبب ذلك في انقطاع الخدمة وفقدان البيانات.\\nيرجى كتابة CONFIRM والنقر فوق OK لإيقاف تشغيل وحدة التحكم; بخلاف ذلك، يرجى النقر فوق إلغاء.
v.admintools.confirm.restorefactorynetmgmtsetting = يرجى كتابة CONFIRM للتأكد من الرغبة في استعادة إعدادات المصنع الافتراضية.تنبيه: تم اختيار إعدادات شبكة الإدارة الافتراضية.\\nسيتسبب تغير هذه الإعدادات في فقدان كافة الوظائف المتصلة بالشبكة للاتصال.\\nيتسبب في فقدان كافة مستويات إدارة الوصول للنظام الفرعي.\\nلاستعادة الوصول، يتعين التوصيل الاتصال بالنظام الفرعي عبر منفذ تسلسلي وإعادة تكوين اتصال الشبكة.\\nتجنب النقر فوق OK ما لم تكن مستعد للمتابعة.
