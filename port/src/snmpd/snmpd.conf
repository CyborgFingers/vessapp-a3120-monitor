###########################################################################
#
# snmpd.conf  -  Promise VessApp, Linux port
#
#   Ported from windows-src/rootfs/usr/etc/snmp/snmpd.conf (net-snmp on the
#   Windows box, "created by the Promise i2 service"). The three original
#   directives are preserved verbatim; the pass_persist + trap lines replace
#   the Windows prsnmpagent.dll AgentX subagent.
#
###########################################################################

# ---- original directives (unchanged) ------------------------------------
syslocation  USA
syscontact  admin@yourcompany.com
rocommunity  VessApp

# ---- listen address (port addition; Windows bound the default) ----------
agentaddress  udp:127.0.0.1:161

# ---- Promise raidv4 subtree (enterprises.7933.1.20) ---------------------
# Linux replacement for prsnmpagent.dll: a net-snmp pass_persist handler that
# serves the whole subtree (subsystem/controller/enclosure/drives/arrays) from
# libi2bdg. Install the built `promise_snmp` binary at this path.
pass_persist  .1.3.6.1.4.1.7933.1.20  /usr/local/bin/promise_snmp

# ---- trap destination ---------------------------------------------------
# raidv4TrapMessage notifications are sent by `promise_trap` (event->trap).
# Point this at your NMS; the smoke test overrides it with a local snmptrapd.
# trap2sink  127.0.0.1  VessApp
