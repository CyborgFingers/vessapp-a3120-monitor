v.admintools.confirm.restorefactorynetmgmtsetting = Пожалуйста, введите слово CONFIRM для подтверждения восстановления заводских настроек по умолчанию.\\nПредупреждение: вы выбрали восстановление сетевых настроек управления по умолчанию.\\nИзменение этих настроек приведет к выводу всех сетевых функций в офлайновый режим.\\nВы полностью потеряете доступ к управлению подсистемой.\\nДля восстановления доступа вам необходимо подключиться к подсистеме через последовательный порт и изменить конфигурацию вашего сетевого соединения.\\nНе нажимайте кнопку OK, если вы не готовы продолжать эту процедуру. 
