; php-fixture.ini - PHP config for the WebPAM web tier (Phase 4, off-device).
;
; Mirrors the shipped appliance's PHP posture (it bundled PHP 7.3, php7ts.dll):
; the htdocs use PHP4-style method-name constructors, so the tier runs UNCHANGED
; on PHP 7.x. Notices/deprecations are silenced the way a production appliance
; php.ini would; warnings/fatals stay visible so the smoke can assert they are
; absent. Loads the Linux php_i2 extension (built into /work/php-ext/modules).
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_STRICT
display_errors = On
log_errors = Off
session.save_path = "/tmp"
extension = /work/php-ext/modules/i2.so
